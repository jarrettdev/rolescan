[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolescan"
version = "0.2.0"
description = "Watches company hiring pages for new openings and notifies you"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pandas==2.3.3",
  "python-dotenv==1.2.1",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
browser = ["seleniumbase==4.47.3"]

[project.scripts]
rolescan = "cli.main:main"

[tool.setuptools]
py-modules = ["rolescan", "process_stream", "hc_scraper", "linkedin_lookup"]
